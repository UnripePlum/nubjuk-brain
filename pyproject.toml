[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nubjuk-brain"
version = "0.1.0"
description = "STI WebSocket brain for Nubjuk voice intent resolution"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.0,<9.0",
]
moonshine = [
  "moonshine-voice>=0.0.59,<0.1",
]
voice-test = [
  "sounddevice>=0.5,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["brain"]

[tool.hatch.build.targets.wheel.force-include]
"brain/intent/default_catalog.json" = "brain/intent/default_catalog.json"
